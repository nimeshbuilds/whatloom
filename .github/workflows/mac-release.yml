name: Build Mac release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; const v=JSON.parse(readFileSync('package.json','utf8')).version; if(process.env.RELEASE_TAG !== 'v'+v) throw new Error('Release tag must match package.json version');"
      - run: npm test
      - run: npm run typecheck
      - name: Build Apple Silicon app
        run: npm run build:mac
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          WHATLOOM_NODE_VERSION: '22.23.4'
      - name: Test packaged application
        run: node scripts/test-mac-bundle.mjs
      - name: Retain application artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Whatloom-macOS-arm64
          path: |
            outputs/Whatloom-*-macOS-arm64.zip
            outputs/Whatloom-*-macOS-arm64.dmg
            outputs/Whatloom-*-macOS-arm64-SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Whatloom $RELEASE_TAG" --notes-file desktop/RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" outputs/Whatloom-*-macOS-arm64.zip outputs/Whatloom-*-macOS-arm64.dmg outputs/Whatloom-*-macOS-arm64-SHA256SUMS.txt
